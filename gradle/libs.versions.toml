androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
androidx-test-monitor = { group = "androidx.test", name = "monitor", version.ref = "testMonitor" }
play-services-games-v2 = { group = "com.google.android.gms", name = "play-services-games-v2", version.ref = "playServicesGamesV2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
