[versions]
agp = "8.7.3"
junit = "4.13.2"
androidxTestExtJunit = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.12.0"
coreKtx = "1.13.1"
testRunner = "1.5.2"
testMonitor = "1.6.1"
playServicesGamesV2 = "20.1.2"

[libraries]
